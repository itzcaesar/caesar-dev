services:
  postgres:
    image: postgres:16-alpine
    container_name: caesar_payload_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caesar_payload
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d caesar_payload"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payload_postgres_data:/var/lib/postgresql/data

volumes:
  payload_postgres_data:
